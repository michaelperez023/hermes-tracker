<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base path the app is served from. `flutter build web --base-href` fills
    it in, for example /hermes-tracker/ for GitHub Pages.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hermes Tracker: a Spring 2020 student team project for checking packages and letters in and out at a campus mail center, updated in 2026. Demo with made-up data. Not an official Florida Polytechnic University app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hermes Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hermes Tracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <noscript>Hermes Tracker needs JavaScript to run.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
